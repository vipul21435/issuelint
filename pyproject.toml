[project]
name = "issuelint"
version = "0.1.0"
description = "Check issue-to-fix task records for solution leaks, test leaks, location hints, underspecification and scope gaps before they become benchmark items."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.scripts]
issuelint = "issuelint.cli:main"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyarrow>=14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issuelint"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PTH", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["issuelint"]
branch = true

[tool.coverage.report]
show_missing = true
